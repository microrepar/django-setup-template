[project]
name = "django-setup-copier-template"
version = "0.2.0"
description = "Template Copier de projeto Django: autenticação por e-mail com ativação de uso único, Celery + Redis, Docker Compose com nginx, HTMX + Tailwind e settings fail-fast"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "copier>=9.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
check = { cmd = "python scripts/check.py", help = "Renderiza o template num diretório temporário e valida o resultado (--full: pipeline completo com tasks + manage.py check)" }
test = { cmd = "python scripts/check.py", help = "Alias de check: a verificação é o teste deste repo" }
lint = { cmd = "ruff check .", help = "Lint do tooling (template/ é conteúdo do projeto gerado, lintado por ele)" }

[tool.ruff]
# template/ é o conteúdo que o Copier gera: pertence ao projeto gerado,
# não ao tooling deste repo.
extend-exclude = ["template"]
