services:
  db:
    # digest fixado: a imagem nao muda sem uma alteracao explicita neste arquivo
    image: postgres:15@sha256:f189cf3e8ad81c21e70c78735f18c65cf1a2635fe5aa2bb59220dda334ee26a9
    stdin_open: true
    tty: true
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    env_file: .env
    ports:
      # apenas loopback: o banco nao fica exposto na rede. O container `web` fala com ele
      # pela rede interna do Compose (POSTGRES_* definidos no .env via env_file).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - django-setup-copier_network

  web:
    platform: linux/x86_64
    build: .
    stdin_open: true
    tty: true
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      # apenas loopback: acesso direto ao Django para depuracao local (o caminho canonico e o Nginx em :8080)
      - "127.0.0.1:8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - django-setup-copier_network

  # Testes: imagem com dependencias de dev; roda sob demanda com
  # `docker compose run --rm test` (ou `uv run task test`).
  test:
    build:
      context: .
      target: dev
    command: pytest
    volumes:
      - .:/code
    env_file: .env
    profiles: [test]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - django-setup-copier_network

  nginx:
    image: nginx:1.31.0@sha256:06aa3d7be10bc6307990c81bdca075793132e9163391abc370c015e344e23128
    restart: always
    ports:
      # porta canonica de acesso, publicada em todas as interfaces
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/code/staticfiles
      - ./media:/code/media
      - ./staticfiles/errors:/etc/nginx/errors
    depends_on:
      - web
    networks:
      - django-setup-copier_network

  redis:
    image: redis:6.2@sha256:a54ecc83b70d33cf1c1d89f0301ba39b6753b91184bfd9a1cb4ef1f805fefc2d
    restart: always
    # broker protegido por senha (REDIS_PASSWORD gerado no .env), mesmo sem porta publicada
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - django-setup-copier_network

  worker:
    build: .
    restart: always
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/code
      - ./media:/code/media
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - django-setup-copier_network
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '1.00'
          memory: 1024M

networks:
  django-setup-copier_network:
    driver: bridge
